server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # index.html 禁止缓存,保证发版后用户立即拿到新入口
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端
    location /api/ {
        # 日记图片上传：单图 5MB 业务限制，放宽到 20m 覆盖 multipart 开销
        client_max_body_size 20m;
        # AI 生成是同步阻塞接口，必须显式放宽读超时。默认只有 60s，而这条链路上：
        #   后端最坏 45s(read-timeout) × 2(max-attempts) = 90s > 60s
        # 于是「重试 1 次」在 nginx 这一跳直接被掐断成 504，重试成为死代码；
        # 更糟的是后端线程还在跑、锁(120s)还持着、DeepSeek token 已计费，
        # 用户看到失败去点重试，60s 内必然撞 6003「正在生成中」。
        # 取 180s 让 nginx 晚于后端(90s)与前端 axios(120s)超时，
        # 保证超时裁决权在前端手里（能拿到 JSON 里的业务码，而不是 nginx 的 HTML 错误页）。
        # 注意：本文件与 habitforge-frontend/nginx.conf 是两份同内容副本，改一处要同步另一处。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://backend:8080/api/;
        # 用 $http_host 保留客户端端口(如 :8081),否则后端会把同源请求误判为跨域
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 日记图片：MinIO habitforge-images 桶（public-read），经此单入口收敛，不对公网开 9000
    location /images/ {
        proxy_pass http://host.docker.internal:9000/habitforge-images/;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public";
    }
}
