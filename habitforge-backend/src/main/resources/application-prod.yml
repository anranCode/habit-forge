spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/habitforge?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      max-lifetime: 600000
      keepalive-time: 120000
      connection-timeout: 10000
      validation-timeout: 5000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
  ai:
    anthropic:
      # 生产 token 必须经环境变量注入。这里**必须**保留空默认值 `:`——
      # Boot 3.5 的 PropertySourcesPlaceholdersResolver 是 ignoreUnresolvablePlaceholders=true,
      # 写成 ${AI_API_KEY}(无默认)时未设置该变量会原样绑成字符串 "${AI_API_KEY}" 这个**非空**值,
      # 它通不过任何"有没有配"的判断, 只会发一个假的 x-api-key 出去撞 401(表现为 6004)。
      # 留空默认值后未配置即空串, 由 PlanAiClient 的凭证护栏明确翻译成 6001(AI 服务未启用)。
      api-key: ${AI_API_KEY:}
    # 出站 HTTP 超时(connect 5s / read 45s)与 retry.max-attempts 在 application.yml 中统一配置,
    # prod 继承该基配置(Spring Boot 合并 application.yml + application-prod.yml), 此处无需重复

jwt:
  secret: ${JWT_SECRET}

# MinIO: 生产走宿主机实例(host.docker.internal), 凭据必须由 .env 提供
minio:
  endpoint: ${MINIO_ENDPOINT:http://host.docker.internal:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  # 生产密钥必须通过环境变量注入,不要在此留默认值
  secret-key: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required in prod}

# CORS 允许的来源模式(逗号分隔);生产只放行精确访问来源,换域名/端口时用环境变量覆盖
app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
  ai:
    # 生产默认开启 AI(可 AI_ENABLED=false 紧急关闭)
    enabled: ${AI_ENABLED:true}

logging:
  level:
    com.habitforge: INFO
