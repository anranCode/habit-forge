spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/habitforge?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
    hikari:
      # 远程 MySQL 会掐掉空闲连接：缩短连接寿命 + 定期保活探测
      max-lifetime: 600000
      keepalive-time: 120000
      connection-timeout: 10000
      validation-timeout: 5000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms

jwt:
  secret: ${JWT_SECRET:habitforge-dev-secret-key-2026-change-in-prod}

# MinIO: 开发环境通过环境变量注入(本地/远程实例均可),默认值仅占位
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  # 真实密钥必须通过环境变量设置,不要在此硬编码
  secret-key: ${MINIO_SECRET_KEY:}

logging:
  level:
    com.habitforge: DEBUG
