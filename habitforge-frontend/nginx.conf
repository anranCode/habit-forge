server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # index.html 禁止缓存,保证发版后用户立即拿到新入口
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端
    location /api/ {
        # 日记图片上传：单图 5MB 业务限制，放宽到 20m 覆盖 multipart 开销
        client_max_body_size 20m;
        proxy_pass http://backend:8080/api/;
        # 用 $http_host 保留客户端端口(如 :8081),否则后端会把同源请求误判为跨域
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 日记图片：MinIO habitforge-images 桶（public-read），经此单入口收敛，不对公网开 9000
    location /images/ {
        proxy_pass http://host.docker.internal:9000/habitforge-images/;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public";
    }
}
